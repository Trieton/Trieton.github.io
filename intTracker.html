<main>
<div class="tracker-container">
    <h2>Turn Tracker</h2>
    <div class="input-group">
        <input type="text" id="playerName" placeholder="Enter name...">
        <input type="number" id="initiativeValue" placeholder="Initiative" min="0">
        <button id="addBtn" onclick="addPlayer()">Add</button>
    </div>
    <ul id="turnList">
    </ul>
    <button id="nextBtn" onclick="nextTurn()">Next Turn</button>
</div>

<script>
    let players = [];
    let activeIndex = 0;
    let currentPlayerId = null;
    function addPlayer() {
        const nameInput = document.getElementById('playerName');
        const initInput = document.getElementById('initiativeValue');
        
        const name = nameInput.value.trim();
        const initiative = parseInt(initInput.value);
        const health = 0;

        if (name && !isNaN(initiative)) {
            const newPlayer = {
               id: crypto.randomUUID(),
               name: name,
               initiative: initiative,
               health: 0
            };

        players.push({
            id: crypto.randomUUID(),
            name,
            initiative,
            health: 0 });

            players.sort((a, b) => b.initiative - a.initiative);

            nameInput.value = '';
            initInput.value = '';

            if (currentPlayerId === null) {
                currentPlayerId = players[0].id;
            }
  
            renderList();
        }
    }

    function removePlayer(index) {
        players.splice(index, 1);
        if (activeIndex >= players.length) activeIndex = 0;
        renderList();
    }

    function nextTurn() {
            if (players.length === 0) return;
                const currentIndex = players.findIndex(
                p => p.id === currentPlayerId
                );

    const nextIndex = (currentIndex + 1) % players.length;
    currentPlayerId = players[nextIndex].id;

    renderList();
    }

    function renderList() {
        const list = document.getElementById('turnList');
        list.innerHTML = '';
        players.forEach((player, index) => {
        const li = document.createElement('li');

        if (player.id === currentPlayerId) {
            li.classList.add("active");
        }

        li.innerHTML = `
            <span>${player.name} (${player.initiative}) Health: <input type="number" value="${player.health}" onchange="players[${index}].health = this.value" /> </span>
            <button class="delete-btn" onclick="removePlayer(${index})">X</button>
        `;

        list.appendChild(li);
        });
    }
</script>


</main>



</body>
</html>
